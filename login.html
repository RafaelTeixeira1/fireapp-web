<html><head><base href="">
<meta charset="UTF-8">
<title>FireApp - Login</title>
<style>
:root {
  --primary: #ff4141;
  --secondary: #2b4c7e;
  --success: #28a745;
  --light: #f8f9fa;
  --dark: #343a40;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #f5f5f5;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-container {
  background: white;
  padding: 2.5rem;
  border-radius: 10px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  width: 100%;
  max-width: 400px;
}

.logo {
  text-align: center;
  margin-bottom: 2rem;
}

.logo svg {
  width: 80px;
  height: 80px;
}

.login-header {
  text-align: center;
  margin-bottom: 2rem;
}

.login-header h1 {
  color: var(--primary);
  font-size: 1.8rem;
  margin-bottom: 0.5rem;
}

.login-header p {
  color: var(--dark);
  opacity: 0.8;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  color: var(--dark);
  font-weight: 500;
}

.form-input {
  width: 100%;
  padding: 0.8rem;
  border: 1px solid #ddd;
  border-radius: 5px;
  font-size: 1rem;
  transition: border-color 0.3s;
}

.form-input:focus {
  border-color: var(--primary);
  outline: none;
}

.forgot-password {
  text-align: right;
  margin-bottom: 1.5rem;
}

.forgot-password a {
  color: var(--secondary);
  text-decoration: none;
  font-size: 0.9rem;
}

.login-btn {
  width: 100%;
  padding: 1rem;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.3s;
}

.login-btn:hover {
  background: #e63737;
}

.register-link {
  text-align: center;
  margin-top: 1.5rem;
}

.register-link a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
}

.error-message {
  color: var(--primary);
  font-size: 0.9rem;
  margin-top: 0.3rem;
  display: none;
}

.logo-img {
  max-width: 100px; 
  height: auto;
}

</style>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <img src="images/logo.png" alt="Logo FireApp" class="logo-img">
    </div>

    <div class="login-header">
      <h1>Bem-vindo ao FireApp</h1>
      <p>Entre para acessar sua conta</p>
    </div>

    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" class="form-input" required>
        <div class="error-message" id="emailError">E-mail inválido</div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" class="form-input" required>
        <div class="error-message" id="passwordError">Senha incorreta</div>
      </div>

      <div class="forgot-password">
        <a href="cadastro.html">Esqueceu a senha?</a>
      </div>

      <button type="button" class="login-btn" onclick="window.location.href='telaPrincipal.html'">Entrar</button>
    </form>

    <div class="register-link">
      Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
    </div>
  </div>

  <script>
    
  </script>
</body>
</html>
