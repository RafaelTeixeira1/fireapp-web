<html><head><base href="">
<meta charset="UTF-8">
<title>FireApp - Cadastro de Incêndio</title>
<style>
  
:root {
  --primary: #ff4141;
  --secondary: #2b4c7e;
  --success: #28a745;
  --warning: #ffc107;
  --danger: #dc3545;
  --light: #f8f9fa;
  --dark: #343a40;
}


* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #f5f5f5;
  min-height: 100vh;
}

.fire-report-container {
  max-width: 1200px;
  margin: 2rem auto;
  padding: 2rem;
  background: white;
  border-radius: 15px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.form-header {
  text-align: center;
  margin-bottom: 2rem;
}

.form-header h1 {
  color: var(--primary);
  margin-bottom: 0.5rem;
}

.form-header p {
  color: var(--dark);
  opacity: 0.7;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
}

.form-section {
  padding: 1rem;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  color: var(--dark);
  font-weight: 500;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 0.8rem;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 1rem;
  transition: border-color 0.3s ease;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--primary);
}

#map {
  width: 100%;
  height: 400px;
  border-radius: 8px;
  margin-bottom: 1rem;
}

.severity-options {
  display: flex;
  gap: 1rem;
  margin-top: 0.5rem;
}

.severity-option {
  flex: 1;
  text-align: center;
  padding: 1rem;
  border: 2px solid #ddd;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.severity-option.selected {
  background-color: var(--primary);
  color: white;
  border-color: var(--primary);
}

.severity-option:hover {
  border-color: var(--primary);
}

.btn {
  width: 100%;
  padding: 1rem;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 1rem;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover {
  background: #ff2929;
  transform: translateY(-2px);
}

.drawing-tools {
  margin-bottom: 1rem;
  padding: 0.5rem;
  background: #f8f9fa;
  border-radius: 8px;
}

.drawing-tools button {
  padding: 0.5rem 1rem;
  margin-right: 0.5rem;
  border: none;
  border-radius: 4px;
  background: var(--secondary);
  color: white;
  cursor: pointer;
}

.drawing-tools button:hover {
  background: #1f3a5f;
}

.coordinates-display {
  font-size: 0.9rem;
  color: var(--dark);
  margin-top: 0.5rem;
}
.notification {
  position: fixed;
  top: 10px;
  right: 10px;
  padding: 15px 20px;
  background-color: var(--success);
  color: white;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  font-size: 1rem;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.notification.success {
  background-color: var(--success);
}

.notification.error {
  background-color: var(--danger);
}

.btn-back {
  max-width: 80px;
  padding: 0.4rem 1rem; 
  font-size: 0.9rem; 
  background-color: var(--secondary); 
  color: var(--light); 
  border-radius: 5px; 
  cursor: pointer; 
  transition: all 0.3s ease; 
  margin-top: 1rem;
}


.btn-back:hover {
  background-color: var(--secondary); 
  color: white; 
  transform: translateY(-2px); 
}

.btn-back:focus {
  outline: none; 
}



</style>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
</head>
<body>

  <div class="fire-report-container">
    <button type="button" class="btn btn-back" onclick="window.location.href='telaPrincipal.html'">Voltar</button>
    <div class="form-header">
      <h1>Cadastro de Incêndio</h1>
      <p>Ajude-nos a identificar e combater incêndios em áreas rurais</p> 
    </div>
   
    
    <form id="fireReportForm" onsubmit="handleSubmit(event)">
      <div class="form-grid">
        <div class="form-section">
          <div class="form-group">
            <label for="fireType">Tipo de Incêndio</label>
            <select id="fireType" required>
              <option value="">Selecione o tipo...</option>
              <option value="vegetation">Vegetação Nativa</option>
              <option value="plantation">Plantação</option>
              <option value="pasture">Pasto</option>
              <option value="forest">Mata/Floresta</option>
            </select>
          </div>

          <div class="form-group">
            <label>Gravidade do Incêndio</label>
            <div class="severity-options">
              <div class="severity-option" data-severity="low" onclick="selectSeverity('low')">
                Baixa
              </div>
              <div class="severity-option" data-severity="medium" onclick="selectSeverity('medium')">
                Média
              </div>
              <div class="severity-option" data-severity="high" onclick="selectSeverity('high')">
                Alta
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="description">Descrição</label>
            <textarea 
              id="description" 
              rows="4" 
              required 
              placeholder="Descreva detalhes importantes sobre o incêndio..."
            ></textarea>
          </div>

          <div class="form-group">
            <label for="reference">Ponto de Referência</label>
            <input 
              type="text" 
              id="reference" 
              required 
              placeholder="Ex: Próximo à Fazenda São João"
            >
          </div>
        </div>

        <div class="form-section">
          <div class="form-group">
            <label>Localização do Incêndio</label>
            <div class="drawing-tools">
              <button type="button" onclick="toggleDrawing('polygon')">Desenhar Área</button>
              <button type="button" onclick="clearDrawing()">Limpar</button>
            </div>
            <div id="map" style="height: 500px;"></div>
            <div class="coordinates-display" id="coordinates"></div>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Enviar Alerta de Incêndio</button>
    </form>
  </div>
  <div id="successNotification" class="notification success" style="display: none;">
    Cadastro de incêndio concluído com sucesso!
  </div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script>
    let map;
    let drawingLayer;
    let selectedSeverity = null;

    function initMap() {

      const initialPosition = { lat: -15.7801, lng: -47.9292 };

      map = L.map('map').setView([initialPosition.lat, initialPosition.lng], 8);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      drawingLayer = new L.FeatureGroup();
      map.addLayer(drawingLayer);

      const drawControl = new L.Control.Draw({
        edit: {
          featureGroup: drawingLayer
        },
        draw: {
          polygon: {
            allowIntersection: false,
            shapeOptions: {
              color: '#ff4141',
              fillColor: '#ff4141',
              fillOpacity: 0.3,
              weight: 2
            }
          },
          circle: false,
          marker: false,
          polyline: false,
          rectangle: false
        }
      });
      map.addControl(drawControl);

      map.on('draw:created', function(e) {
        const layer = e.layer;
        drawingLayer.clearLayers();  
        drawingLayer.addLayer(layer); 

        updateCoordinatesDisplay(layer);
      });
    }

    function updateCoordinatesDisplay(layer) {
      const coordinates = layer.getLatLngs();
      const coordsText = coordinates.map(coord =>
        `${coord.lat.toFixed(6)}, ${coord.lng.toFixed(6)}`
      ).join('\n');
      document.getElementById('coordinates').innerHTML =
        '<strong>Coordenadas da área:</strong><br>' + coordsText;
    }

    window.onload = initMap;

    function selectSeverity(severity) {
  const options = document.querySelectorAll('.severity-option');
  options.forEach(option => option.classList.remove('selected'));

  const selectedOption = document.querySelector(`.severity-option[data-severity="${severity}"]`);
  if (selectedOption) {
    selectedOption.classList.add('selected');
  }

  selectedSeverity = severity;
}

function handleSubmit(event) {
  event.preventDefault(); // Previne o comportamento padrão do formulário

  // Mostrar notificação de sucesso
  const notification = document.getElementById('successNotification');
  notification.style.display = 'block';

  // Ocultar após 3 segundos
  setTimeout(() => {
    notification.style.display = 'none';
  }, 3000);

  // Limpar o formulário ou redirecionar
  document.getElementById('fireReportForm').reset();
  const options = document.querySelectorAll('.severity-option');
  options.forEach(option => option.classList.remove('selected'));
}

  </script>
</body>
</html>
