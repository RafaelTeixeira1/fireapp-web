<html><head><base href="">
<meta charset="UTF-8">
<title>FireApp - Configurações</title>
<style>
:root {
  --primary: #ff4141;
  --secondary: #2b4c7e;
  --success: #28a745;
  --warning: #ffc107;
  --danger: #dc3545;
  --light: #f8f9fa;
  --dark: #343a40;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #f5f5f5;
  min-height: 100vh;
}

.settings-container {
  max-width: 800px;
  margin: 2rem auto;
  padding: 2rem;
}

.header {
  margin-bottom: 2rem;
}

.header h1 {
  color: var(--primary);
  margin-bottom: 0.5rem;
}

.header p {
  color: var(--dark);
  opacity: 0.8;
}

.settings-section {
  background: white;
  border-radius: 15px;
  padding: 2rem;
  margin-bottom: 2rem;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.settings-section h2 {
  color: var(--secondary);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  color: var(--dark);
  font-weight: 500;
}

.form-group input[type="text"],
.form-group input[type="email"],
.form-group input[type="tel"],
.form-group select {
  width: 100%;
  padding: 0.8rem;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 1rem;
  transition: border-color 0.3s ease;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--primary);
}

.switch-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
}

.switch-label {
  color: var(--dark);
  font-weight: 500;
}

.switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: .4s;
  border-radius: 34px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: .4s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: var(--primary);
}

input:checked + .slider:before {
  transform: translateX(26px);
}

.radius-selector {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-top: 0.5rem;
}

.radius-selector input[type="range"] {
  flex: 1;
}

.radius-value {
  min-width: 60px;
  text-align: right;
  color: var(--primary);
  font-weight: 500;
}

.btn-container {
  display: flex;
  gap: 1rem;
  margin-top: 2rem;
}

.btn {
  padding: 1rem 2rem;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.3s ease;
  flex: 1;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-secondary {
  background: var(--light);
  color: var(--dark);
}

.btn:hover {
  transform: translateY(-2px);
  opacity: 0.9;
}

.profile-picture {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  overflow: hidden;
  margin-bottom: 1rem;
  position: relative;
  cursor: pointer;
}

.profile-picture img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-picture:hover::after {
  content: "Alterar foto";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.7);
  color: white;
  font-size: 0.8rem;
  padding: 0.3rem;
  text-align: center;
}

.notification-schedule {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 1rem;
  margin-top: 1rem;
}

.time-slot {
  text-align: center;
  padding: 0.5rem;
  border: 1px solid #ddd;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.time-slot.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.btn-back {
  max-width: 80px;
  padding: 0.4rem 1rem; 
  font-size: 0.9rem; 
  background-color: var(--secondary); 
  color: var(--light); 
  border-radius: 5px; 
  cursor: pointer; 
  transition: all 0.3s ease; 
  margin-top: 1rem;
}


.btn-back:hover {
  background-color: var(--secondary); 
  color: white; 
  transform: translateY(-2px); 
}

.btn-back:focus {
  outline: none; 
}

</style>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="settings-container">
    <button type="button" class="btn btn-back" onclick="window.location.href='telaPrincipal.html'">Voltar</button>  
    <div class="header">
      <h1>Configurações</h1>
      <p>Gerencie suas preferências e informações pessoais</p>
    </div>

    <form id="settingsForm" onsubmit="saveSettings(event)">
      <div class="settings-section">
        <h2><i class="fas fa-user"></i> Perfil</h2>
        <div class="profile-picture" onclick="document.getElementById('profilePicture').click()">
          <img id="profileImage" src="https://via.placeholder.com/100" alt="Foto de perfil">
          <input type="file" id="profilePicture" hidden accept="image/*" onchange="updateProfilePicture(event)">
        </div>
        
        <div class="form-group">
          <label for="name">Nome Completo</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Telefone</label>
          <input type="tel" id="phone" name="phone" required>
        </div>
      </div>

      <div class="settings-section">
        <h2><i class="fas fa-bell"></i> Notificações</h2>
        
        <div class="switch-container">
          <span class="switch-label">Receber notificações push</span>
          <label class="switch">
            <input type="checkbox" id="pushNotifications" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-container">
          <span class="switch-label">Notificações por e-mail</span>
          <label class="switch">
            <input type="checkbox" id="emailNotifications">
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-container">
          <span class="switch-label">Notificações por SMS</span>
          <label class="switch">
            <input type="checkbox" id="smsNotifications">
            <span class="slider"></span>
          </label>
        </div>

        <div class="form-group">
          <label>Raio de notificação (km)</label>
          <div class="radius-selector">
            <input type="range" id="notificationRadius" min="1" max="50" value="10" 
                   oninput="updateRadiusValue(this.value)">
            <span id="radiusValue" class="radius-value">10 km</span>
          </div>
        </div>

        <div class="form-group">
          <label>Horários preferenciais para notificações</label>
          <div class="notification-schedule" id="notificationSchedule">
            <div class="time-slot" onclick="toggleTimeSlot(this)">Manhã
              <br>6h - 12h</div>
            <div class="time-slot" onclick="toggleTimeSlot(this)">Tarde
              <br>12h - 18h</div>
            <div class="time-slot" onclick="toggleTimeSlot(this)">Noite
              <br>18h - 0h</div>
            <div class="time-slot" onclick="toggleTimeSlot(this)">Madrugada
              <br>0h - 6h</div>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <h2><i class="fas fa-shield-alt"></i> Privacidade</h2>
        
        <div class="switch-container">
          <span class="switch-label">Tornar meu perfil público</span>
          <label class="switch">
            <input type="checkbox" id="publicProfile">
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-container">
          <span class="switch-label">Compartilhar localização</span>
          <label class="switch">
            <input type="checkbox" id="shareLocation" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="btn-container">
        <button type="button" class="btn btn-secondary" onclick="resetSettings()">
          Restaurar Padrões
        </button>
        <button type="submit" class="btn btn-primary">
          Salvar Alterações
        </button>
      </div>
    </form>
  </div>

<script>
function updateRadiusValue(value) {
  document.getElementById('radiusValue').textContent = `${value} km`;
}

function toggleTimeSlot(element) {
  element.classList.toggle('active');
}

function updateProfilePicture(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('profileImage').src = e.target.result;
    }
    reader.readAsDataURL(file);
  }
}

function saveSettings(event) {
  event.preventDefault();
  
  // Coleta todos os dados do formulário
  const formData = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    notifications: {
      push: document.getElementById('pushNotifications').checked,
      email: document.getElementById('emailNotifications').checked,
      sms: document.getElementById('smsNotifications').checked,
      radius: document.getElementById('notificationRadius').value
    },
    privacy: {
      publicProfile: document.getElementById('publicProfile').checked,
      shareLocation: document.getElementById('shareLocation').checked
    }
  };

  // Aqui você implementaria a lógica para salvar as configurações no backend
  console.log('Salvando configurações:', formData);
  
  // Simula uma requisição
  setTimeout(() => {
    alert('Configurações salvas com sucesso!');
  }, 1000);
}

function resetSettings() {
  if (confirm('Tem certeza que deseja restaurar todas as configurações para o padrão?')) {
    document.getElementById('settingsForm').reset();
    document.getElementById('notificationRadius').value = 10;
    updateRadiusValue(10);
    
    // Remove a classe active de todos os time slots
    document.querySelectorAll('.time-slot').forEach(slot => {
      slot.classList.remove('active');
    });
    
    // Reset da imagem de perfil
    document.getElementById('profileImage').src = 'https://via.placeholder.com/100';
  }
}

// Carrega as configurações salvas quando a página é carregada
window.onload = function() {
  // Aqui você implementaria a lógica para carregar as configurações do backend
  // Por enquanto, vamos simular alguns dados
  const savedSettings = {
    name: 'João Silva',
    email: 'joao.silva@email.com',
    phone: '(11) 98765-4321',
    notifications: {
      push: true,
      email: false,
      sms: true,
      radius: 15
    },
    privacy: {
      publicProfile: false,
      shareLocation: true
    }
  };

  // Preenche o formulário com os dados salvos
  document.getElementById('name').value = savedSettings.name;
  document.getElementById('email').value = savedSettings.email;
  document.getElementById('phone').value = savedSettings.phone;
  
  document.getElementById('pushNotifications').checked = savedSettings.notifications.push;
  document.getElementById('emailNotifications').checked = savedSettings.notifications.email;
  document.getElementById('smsNotifications').checked = savedSettings.notifications.sms;
  
  document.getElementById('notificationRadius').value = savedSettings.notifications.radius;
  updateRadiusValue(savedSettings.notifications.radius);
  
  document.getElementById('publicProfile').checked = savedSettings.privacy.publicProfile;
  document.getElementById('shareLocation').checked = savedSettings.privacy.shareLocation;
};
</script>
</body>
</html>
